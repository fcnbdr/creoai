<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreoAI - AI生图生视频创作平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* 动态背景容器 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFFFFF 0%, #F8FAFC 100%);
            z-index: 0;
        }

        /* 光斑样式 */
        .light-spot {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.3) 0%, rgba(147, 197, 253, 0) 70%);
            pointer-events: none;
            transition: transform 0.25s ease-out;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.5; }
        }

        /* 登录卡片动画 */
        .login-card {
            animation: slideUpFadeIn 0.6s ease-out;
        }

        @keyframes slideUpFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 选项卡指示器 */
        .tab-indicator {
            transition: all 0.25s ease-out;
        }

        /* 输入框底部线条 */
        .input-line {
            transition: all 0.25s ease-out;
        }

        .input-field:focus + .input-line {
            border-color: #3B82F6;
            border-width: 2px;
        }

        /* 图标颜色过渡 */
        .input-icon {
            transition: color 0.25s ease-out;
        }

        .input-field:focus ~ .input-icon {
            color: #3B82F6;
        }

        /* 按钮悬停效果 */
        .login-btn {
            transition: all 0.25s ease-out;
        }

        .login-btn:hover {
            background-color: #2563EB;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        /* 错误提示条 */
        .error-bar {
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 内容淡入淡出 */
        .tab-content {
            transition: opacity 0.25s ease-out;
        }

        .tab-content.hidden {
            opacity: 0;
            display: none;
        }

        .tab-content.active {
            opacity: 1;
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

    <!-- 动态背景 -->
    <div class="bg-container" id="bgContainer">
        <!-- 光斑将通过JavaScript动态生成 -->
    </div>

    <!-- 登录卡片 -->
    <div class="login-card bg-white rounded-[20px] shadow-[0_2px_20px_rgba(0,0,0,0.06)] w-[420px] max-w-[90vw] px-12 py-[60px] relative z-10">
        
        <!-- 错误提示条（默认隐藏） -->
        <div id="errorBar" class="error-bar hidden absolute -top-12 left-0 right-0 bg-red-50 border border-red-200 rounded-lg px-4 py-3 flex items-center justify-between">
            <span class="text-red-700 text-sm" id="errorMessage">邮箱或密码错误</span>
            <button onclick="closeError()" class="text-red-500 hover:text-red-700 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Logo和标题 -->
        <div class="text-center mb-10">
            <!-- SVG Logo -->
            <svg class="w-16 h-16 mx-auto mb-4" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 字母C形状 -->
                <path d="M40 12C26.7452 12 16 22.7452 16 36C16 49.2548 26.7452 60 40 60" 
                      stroke="#3B82F6" 
                      stroke-width="4" 
                      stroke-linecap="round"/>
                <!-- 播放按钮线条 -->
                <path d="M36 28L44 32L36 36V28Z" 
                      fill="#60A5FA" 
                      opacity="0.8"/>
            </svg>
            
            <!-- 品牌名称 -->
            <h1 class="text-3xl font-bold text-[#1E293B] mb-2">
                <span class="font-extrabold">Creo</span><span class="bg-gradient-to-r from-[#3B82F6] to-[#60A5FA] bg-clip-text text-transparent text-2xl ml-1">AI</span>
            </h1>
            <p class="text-[#64748B] text-sm">AI生图生视频创作平台</p>
        </div>

        <!-- 登录方式选项卡 -->
        <div class="flex mb-8 relative">
            <button onclick="switchTab('email')" id="emailTab" class="flex-1 pb-3 text-center font-medium text-[#3B82F6] transition-colors">
                邮箱登录
            </button>
            <button onclick="switchTab('phone')" id="phoneTab" class="flex-1 pb-3 text-center font-medium text-[#64748B] transition-colors">
                手机号登录
            </button>
            <!-- 滑动指示器 -->
            <div id="tabIndicator" class="tab-indicator absolute bottom-0 left-0 w-1/2 h-0.5 bg-[#3B82F6]"></div>
        </div>

        <!-- 邮箱登录表单 -->
        <div id="emailForm" class="tab-content active">
            <!-- 邮箱输入框 -->
            <div class="mb-6 relative">
                <input type="email" 
                       id="emailInput"
                       class="input-field w-full pb-3 text-[#1E293B] placeholder-[#94A3B8] outline-none bg-transparent border-b border-[#E2E8F0]"
                       placeholder="请输入邮箱地址">
                <div class="input-line absolute bottom-0 left-0 w-full border-b border-[#E2E8F0]"></div>
                <i class="input-icon fas fa-envelope absolute left-0 top-1/2 -translate-y-1/2 text-[#94A3B8]"></i>
            </div>

            <!-- 密码输入框 -->
            <div class="mb-6 relative">
                <input type="password" 
                       id="passwordInput"
                       class="input-field w-full pb-3 text-[#1E293B] placeholder-[#94A3B8] outline-none bg-transparent border-b border-[#E2E8F0] pr-8"
                       placeholder="请输入密码">
                <div class="input-line absolute bottom-0 left-0 w-full border-b border-[#E2E8F0]"></div>
                <i class="input-icon fas fa-lock absolute left-0 top-1/2 -translate-y-1/2 text-[#94A3B8]"></i>
                <button onclick="togglePassword()" class="absolute right-0 top-1/2 -translate-y-1/2 text-[#94A3B8] hover:text-[#3B82F6] transition-colors">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <!-- 手机号登录表单（默认隐藏） -->
        <div id="phoneForm" class="tab-content hidden">
            <!-- 手机号输入框 -->
            <div class="mb-6 relative">
                <input type="tel" 
                       id="phoneInput"
                       class="input-field w-full pb-3 text-[#1E293B] placeholder-[#94A3B8] outline-none bg-transparent border-b border-[#E2E8F0]"
                       placeholder="请输入手机号">
                <div class="input-line absolute bottom-0 left-0 w-full border-b border-[#E2E8F0]"></div>
                <i class="input-icon fas fa-phone absolute left-0 top-1/2 -translate-y-1/2 text-[#94A3B8]"></i>
            </div>

            <!-- 验证码输入框 -->
            <div class="mb-6 relative">
                <input type="text" 
                       id="codeInput"
                       class="input-field w-full pb-3 text-[#1E293B] placeholder-[#94A3B8] outline-none bg-transparent border-b border-[#E2E8F0] pr-24"
                       placeholder="请输入验证码">
                <div class="input-line absolute bottom-0 left-0 w-full border-b border-[#E2E8F0]"></div>
                <i class="input-icon fas fa-shield-alt absolute left-0 top-1/2 -translate-y-1/2 text-[#94A3B8]"></i>
                <button onclick="sendCode()" class="absolute right-0 top-1/2 -translate-y-1/2 text-[#3B82F6] text-sm font-medium hover:text-[#2563EB] transition-colors" id="sendCodeBtn">
                    获取验证码
                </button>
            </div>
        </div>

        <!-- 记住我和忘记密码 -->
        <div class="flex items-center justify-between mb-8">
            <label class="flex items-center cursor-pointer">
                <input type="checkbox" class="w-4 h-4 rounded border-[#E2E8F0] text-[#3B82F6] focus:ring-[#3B82F6]">
                <span class="ml-2 text-sm text-[#64748B]">记住我</span>
            </label>
            <a href="#" class="text-sm text-[#64748B] hover:text-[#3B82F6] transition-colors">忘记密码？</a>
        </div>

        <!-- 登录按钮 -->
        <button onclick="handleLogin()" class="login-btn w-full bg-[#3B82F6] text-white font-medium py-3 rounded-xl mb-6">
            登 录
        </button>

        <!-- 注册链接 -->
        <div class="text-center">
            <span class="text-[#64748B] text-sm">没有账号？</span>
            <a href="#" class="text-[#3B82F6] text-sm font-medium hover:text-[#2563EB] transition-colors ml-1">创建一个</a>
        </div>
    </div>

    <script>
        // 生成动态背景光斑
        function createLightSpots() {
            const container = document.getElementById('bgContainer');
            const spotCount = 18;
            
            for (let i = 0; i < spotCount; i++) {
                const spot = document.createElement('div');
                spot.className = 'light-spot';
                
                // 随机大小（30px - 150px）
                const size = Math.random() * 120 + 30;
                spot.style.width = size + 'px';
                spot.style.height = size + 'px';
                
                // 随机位置
                spot.style.left = Math.random() * 100 + '%';
                spot.style.top = Math.random() * 100 + '%';
                
                // 存储初始位置和大小用于视差计算
                spot.dataset.initialX = parseFloat(spot.style.left);
                spot.dataset.initialY = parseFloat(spot.style.top);
                spot.dataset.size = size;
                
                // 随机呼吸延迟
                spot.style.animationDelay = Math.random() * 4 + 's';
                
                container.appendChild(spot);
            }
        }

        // 鼠标跟随视差效果
        document.addEventListener('mousemove', (e) => {
            const spots = document.querySelectorAll('.light-spot');
            const mouseX = e.clientX / window.innerWidth;
            const mouseY = e.clientY / window.innerHeight;
            
            spots.forEach(spot => {
                const size = parseFloat(spot.dataset.size);
                const initialX = parseFloat(spot.dataset.initialX);
                const initialY = parseFloat(spot.dataset.initialY);
                
                // 大光斑移动慢，小光斑移动快（反向视差）
                const speed = (150 - size) / 150 * 20;
                const moveX = (mouseX - 0.5) * speed;
                const moveY = (mouseY - 0.5) * speed;
                
                spot.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
            });
        });

        // 选项卡切换
        function switchTab(tab) {
            const emailTab = document.getElementById('emailTab');
            const phoneTab = document.getElementById('phoneTab');
            const emailForm = document.getElementById('emailForm');
            const phoneForm = document.getElementById('phoneForm');
            const indicator = document.getElementById('tabIndicator');
            
            if (tab === 'email') {
                emailTab.classList.add('text-[#3B82F6]');
                emailTab.classList.remove('text-[#64748B]');
                phoneTab.classList.add('text-[#64748B]');
                phoneTab.classList.remove('text-[#3B82F6]');
                
                emailForm.classList.remove('hidden');
                emailForm.classList.add('active');
                phoneForm.classList.add('hidden');
                phoneForm.classList.remove('active');
                
                indicator.style.left = '0';
            } else {
                phoneTab.classList.add('text-[#3B82F6]');
                phoneTab.classList.remove('text-[#64748B]');
                emailTab.classList.add('text-[#64748B]');
                emailTab.classList.remove('text-[#3B82F6]');
                
                phoneForm.classList.remove('hidden');
                phoneForm.classList.add('active');
                emailForm.classList.add('hidden');
                emailForm.classList.remove('active');
                
                indicator.style.left = '50%';
            }
        }

        // 显示/隐藏密码
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // 发送验证码
        let countdown = 0;
        function sendCode() {
            if (countdown > 0) return;
            
            const phoneInput = document.getElementById('phoneInput');
            if (!phoneInput.value || !/^1[3-9]\d{9}$/.test(phoneInput.value)) {
                showError('请输入正确的手机号');
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            countdown = 60;
            btn.textContent = `${countdown}s`;
            btn.disabled = true;
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    btn.textContent = '获取验证码';
                    btn.disabled = false;
                } else {
                    btn.textContent = `${countdown}s`;
                }
            }, 1000);
            
            // 模拟发送成功
            setTimeout(() => {
                alert('验证码已发送：123456');
            }, 500);
        }

        // 处理登录
        function handleLogin() {
            const emailTab = document.getElementById('emailTab');
            const isEmailLogin = emailTab.classList.contains('text-[#3B82F6]');
            
            if (isEmailLogin) {
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                
                if (!email || !password) {
                    showError('请填写完整信息');
                    return;
                }
                
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showError('邮箱格式不正确');
                    return;
                }
                
                // 模拟登录成功
                alert('登录成功！');
            } else {
                const phone = document.getElementById('phoneInput').value;
                const code = document.getElementById('codeInput').value;
                
                if (!phone || !code) {
                    showError('请填写完整信息');
                    return;
                }
                
                if (!/^1[3-9]\d{9}$/.test(phone)) {
                    showError('手机号格式不正确');
                    return;
                }
                
                if (code !== '123456') {
                    showError('验证码错误');
                    return;
                }
                
                // 模拟登录成功
                alert('登录成功！');
            }
        }

        // 显示错误提示
        function showError(message) {
            const errorBar = document.getElementById('errorBar');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = message;
            errorBar.classList.remove('hidden');
            
            // 3秒后自动关闭
            setTimeout(() => {
                closeError();
            }, 3000);
        }

        // 关闭错误提示
        function closeError() {
            const errorBar = document.getElementById('errorBar');
            errorBar.classList.add('hidden');
        }

        // 初始化
        window.addEventListener('load', () => {
            createLightSpots();
        });
    </script>
</body>
</html>
